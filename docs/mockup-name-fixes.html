<title>Name Fixes Mock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column — photo, what Claude said, the question */
:root{
  --bg:#f3f5f1; --card:#ffffff; --fg:#1d2420; --muted:#5d6a62; --line:#d9e0da;
  --accent:#2f7a55; --accent-soft:#e2f0e8; --photo:#e6ddd0;
  --display:"Fraunces",Georgia,serif; --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --card:#1d2521; --fg:#e8eee9; --muted:#9aa89f; --line:#2e3933;
  --accent:#6cc79a; --accent-soft:#1f3a2c; --photo:#3a332a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --card:#1d2521; --fg:#e8eee9; --muted:#9aa89f; --line:#2e3933;
  --accent:#6cc79a; --accent-soft:#1f3a2c; --photo:#3a332a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:420px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.photo{background:var(--photo);border-radius:14px;height:140px;display:flex;align-items:center;justify-content:center;font-size:3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--display);font-size:1.5rem;line-height:1.2;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
button{font:inherit;cursor:pointer;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:12px 14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600;text-align:center}
button.quiet{background:transparent;color:var(--muted)}
.row{display:flex;gap:8px}
input{font:inherit;flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.done{background:var(--accent-soft);border-radius:12px;padding:14px}
</style>

<div class="wrap">
  <p class="muted">Mock only. Pretend you just sent this photo.</p>
  <div class="photo" aria-hidden="true">🍗</div>
  <section class="card" id="card"></section>
</div>

<script>
const saved = ["Chicken thighs", "Chicken breast fillets", "Whole chicken", "Chicken drumsticks"];
const card = document.getElementById("card");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ask(){
  card.innerHTML =
    `<p class="muted">Claude says: <strong>Chicken</strong></p>
     <p class="big">Which chicken?</p>
     <div class="opts">` +
     saved.map((s,i) => `<button data-i="${i}">${esc(s)}</button>`).join("") +
     `<button class="quiet" id="keep">Just "Chicken"</button>
      <button class="quiet" id="other">Something else…</button>
     </div>`;
  card.querySelectorAll("[data-i]").forEach(b => b.onclick = () => done(saved[+b.dataset.i], false));
  document.getElementById("keep").onclick = () => done("Chicken", false);
  document.getElementById("other").onclick = edit;
}
function edit(){
  card.innerHTML =
    `<p class="big">What is it?</p>
     <div class="row"><input id="name" aria-label="Name" placeholder="e.g. Chicken wings"><button class="primary" id="save">Save</button></div>`;
  const i = document.getElementById("name"); i.focus();
  const save = () => { const v = i.value.trim(); if(!v) return; if(!saved.includes(v)) saved.push(v); done(v, true); };
  document.getElementById("save").onclick = save;
  i.onkeydown = e => { if(e.key === "Enter") save(); };
}
function done(name, isNew){
  card.innerHTML =
    `<div class="done"><p class="big">✓ ${esc(name)}</p>
     <p class="muted">${isNew ? "Saved. It'll be an option next time." : "Added."}</p></div>
     <button class="primary" id="again">Send another chicken photo</button>`;
  document.getElementById("again").onclick = ask;
}
ask();
</script>
