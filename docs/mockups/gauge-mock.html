<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo gauge mocks</title>
<style>
:root{
  --bg:#0A1210;--surface:#111C18;--surface-2:#16241F;--border:#1E2C27;--track:#1C2B26;
  --text:#E8EFEC;--text-2:#C9D6D1;--muted:#8A9E96;--dim:#6F847C;
  --accent:#8FD4B0;--warn:#F2B35B;--danger:#F08A7E;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,monospace;
}
html[data-theme="light"]{
  --bg:#94AB9C;--surface:#AEC1B5;--surface-2:#8AA192;--border:#82998B;--track:#869D8E;
  --text:#08120D;--text-2:#18281F;--muted:#27392F;--dim:#3C5045;
  --accent:#145F40;--warn:#703F02;--danger:#8A2318;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);padding:16px}
.wrap{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar button{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 14px;font:inherit;min-height:44px}
h1{font-size:20px;margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.lbl{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1}
.big small{font-size:22px;color:var(--muted)}
.sub{font-size:14px;color:var(--text-2)}
.check{font-size:13px;color:var(--warn)}
/* A ring */
.ring{position:relative;width:200px;height:200px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
/* B bar */
.track{width:100%;height:14px;background:var(--track);border-radius:7px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:7px;transition:width .3s}
/* C dots */
.dots{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;width:100%}
.dot{aspect-ratio:1;border-radius:50%;background:var(--track);transition:background .3s}
.dot.done{background:var(--accent)}
.dot.amber{background:var(--warn)}
.dot.now{outline:2px solid var(--accent);outline-offset:2px;animation:p 1s infinite}
@keyframes p{50%{opacity:.4}}
/* D half dial */
.dial{position:relative;width:240px;height:130px}
.dial .mid{position:absolute;left:0;right:0;bottom:0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Photo waiting gauge — pick one</h1>
  <div class="bar">
    <button id="play">▶ Play again</button>
    <button id="theme">Light / dark</button>
  </div>

  <div class="card"><span class="lbl">A · Ring</span>
    <div class="ring">
      <svg width="200" height="200"><circle cx="100" cy="100" r="86" fill="none" stroke="var(--track)" stroke-width="16"/>
        <circle id="aArc" cx="100" cy="100" r="86" fill="none" stroke="var(--accent)" stroke-width="16" stroke-linecap="round" stroke-dasharray="540.4" stroke-dashoffset="540.4" style="transition:stroke-dashoffset .3s"/></svg>
      <div class="mid"><div class="big"><span class="n">0</span><small>/26</small></div><div class="sub">photos read</div></div>
    </div>
    <div class="check"><span class="c">0</span> to check</div>
  </div>

  <div class="card"><span class="lbl">B · Bar</span>
    <div class="big"><span class="n">0</span><small>/26</small></div>
    <div class="track"><div class="fill" id="bFill" style="width:0"></div></div>
    <div class="sub">Reading photos… about <span id="bSec">52</span>s left</div>
  </div>

  <div class="card"><span class="lbl">C · One dot per photo</span>
    <div class="dots" id="cDots"></div>
    <div class="sub"><b class="n">0</b> of 26 read · <span class="check"><span class="c">0</span> amber = check</span></div>
  </div>

  <div class="card"><span class="lbl">D · Half dial</span>
    <div class="dial">
      <svg width="240" height="130" viewBox="0 0 240 130"><path d="M20 120 A100 100 0 0 1 220 120" fill="none" stroke="var(--track)" stroke-width="18" stroke-linecap="round"/>
        <path id="dArc" d="M20 120 A100 100 0 0 1 220 120" fill="none" stroke="var(--accent)" stroke-width="18" stroke-linecap="round" stroke-dasharray="314.2" stroke-dashoffset="314.2" style="transition:stroke-dashoffset .3s"/></svg>
      <div class="mid"><div class="big"><span class="n">0</span><small>/26</small></div></div>
    </div>
    <div class="sub">Check list opens by itself</div>
  </div>
</div>
<script>
const TOTAL=26, AMBER=new Set([4,11,19]);
const dots=document.getElementById('cDots');
for(let i=0;i<TOTAL;i++){const d=document.createElement('div');d.className='dot';dots.appendChild(d)}
let t;
function show(n){
  const f=n/TOTAL, c=[...AMBER].filter(i=>i<n).length;
  document.querySelectorAll('.n').forEach(e=>e.textContent=n);
  document.querySelectorAll('.c').forEach(e=>e.textContent=c);
  document.getElementById('aArc').style.strokeDashoffset=540.4*(1-f);
  document.getElementById('dArc').style.strokeDashoffset=314.2*(1-f);
  document.getElementById('bFill').style.width=(f*100)+'%';
  document.getElementById('bSec').textContent=(TOTAL-n)*2;
  [...dots.children].forEach((d,i)=>d.className='dot'+(i<n?(AMBER.has(i)?' amber':' done'):i===n?' now':''));
}
function play(){clearInterval(t);let n=0;show(0);t=setInterval(()=>{n++;show(n);if(n>=TOTAL)clearInterval(t)},450)}
document.getElementById('play').onclick=play;
document.getElementById('theme').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='light'?'dark':'light'};
play();
</script>
</body>
</html>
