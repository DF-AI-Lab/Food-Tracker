<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No date fridge mock</title>
<style>
:root{--bg:#0A1210;--surface:#111C18;--border:#1E2C27;--track:#1C2B26;--text:#E8EFEC;--text-2:#C9D6D1;--muted:#8A9E96;--dim:#6F847C;--accent:#8FD4B0;--warn:#F2B35B;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);padding:16px}
.wrap{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;justify-content:space-between;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin-top:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.row{padding:16px 20px 14px;border-top:1px solid var(--border)}.row:first-child{border-top:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.when{font-family:var(--mono);font-size:14px;color:var(--text-2)}.when .d{color:var(--dim)}
.line{display:block;height:4px;border-radius:2px;background:var(--track);margin-top:12px;overflow:hidden}.line b{display:block;height:100%;background:var(--accent);border-radius:2px}
.line.amb b{background:var(--warn)}
.nd{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:1px 6px}
.when.amb{color:var(--warn)}
.cap{font-size:12px;color:var(--dim);text-align:center}
</style></head><body><div class="wrap">
<div class="sec">MAINS · 2<span>⌄</span></div>
<div class="card">
 <div class="row"><div class="top"><span class="name">Beef mince</span><span class="when">Sun 18 Oct <span class="d">· 5 days</span></span></div><span class="line"><b style="width:100%"></b></span></div>
 <div class="row"><div class="top"><span class="name">Gammon</span><span class="when">Wed 21 Oct <span class="d">· 8 days</span></span></div><span class="line"><b style="width:100%"></b></span></div>
</div>
<div class="sec">MISC · 2<span>⌄</span></div>
<div class="card">
 <div class="row"><div class="top"><span class="name">Brie <span class="nd">NO DATE</span></span><span class="when">2 days in</span></div><span class="line amb"><b style="width:29%"></b></span></div>
 <div class="row"><div class="top"><span class="name">Cheddar <span class="nd">NO DATE</span></span><span class="when amb">8 days in</span></div><span class="line amb"><b style="width:100%"></b></span></div>
</div>
<div class="cap">Brie: 2 days in, amber line fills over 7 days.<br>Cheddar: past 7 days, so the days turn amber too.<br>Tap either → Edit → add the date.</div>
</div></body></html>
