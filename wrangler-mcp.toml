# Cloudflare Worker for the Food Tracker MCP (code in mcp/)
# Deploy: npx wrangler deploy -c wrangler-mcp.toml
#
# Secrets (not stored in this file). Set each with:
#   wrangler secret put MCP_TOKEN -c wrangler-mcp.toml                  # the secret part of the /mcp/<token> URL
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT -c wrangler-mcp.toml   # service account JSON, paste the whole file

name = "food-tracker-mcp"
main = "mcp/src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[vars]
FIREBASE_PROJECT_ID = "food-tracker-92b1c"
# The household to read and write. Fill this in before deploying.
HOUSEHOLD_ID = ""
